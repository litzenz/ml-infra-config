apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-apps
  namespace: argocd
spec:
  project: infra-project # <--- Uses the project created by the file above
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/litzen/ml-infra-config.git
    path: infrastructure # <--- Points to the infrastructure folder in that repo
    recursive: true # <--- Tells ArgoCD to also look in subfolders for more apps
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    # namespace: argocd