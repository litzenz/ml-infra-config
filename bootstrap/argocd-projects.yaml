apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-projects
  namespace: argocd
spec:
  project: default  # Projects must be managed by the default project
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/litzen/ml-infra-config.git
    path: projects
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true