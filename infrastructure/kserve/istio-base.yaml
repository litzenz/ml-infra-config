# -----------------------------------------------------------------------------
# APPLICATION: Istio Control Plane (Istiod)
# PURPOSE: Manages service discovery, TLS certificates, and routing logic.
# OPTIMIZATION: Using the "Minimal" approach to save RAM on local M4 hardware.
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    # Wave 10: Ensures networking is established before Knative (Wave 20)
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: infra-project
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.21.0
    helm:
      values: |
        meshConfig:
          # Enables stdout logging for easier debugging via 'kubectl logs'
          accessLogFile: /dev/stdout
        pilot:
          # Tight resource constraints for a local 16GB RAM environment
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system