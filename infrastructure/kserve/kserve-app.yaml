apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/kserve/kserve.git'
    targetRevision: v0.12.0
    path: install/v0.12.0 # Standard installation path
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kserve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true