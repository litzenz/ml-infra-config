# -----------------------------------------------------------------------------
# APPLICATION: KServe Core (Raw Deployment Mode)
# PURPOSE: Orchestrates InferenceServices without the Knative overhead.
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve-resources
  namespace: argocd
  annotations:
    # Wave 20: Must start after Cert-Manager (Wave 5) and Issuers (Wave 6)
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: infra-project
  source:
    # 1. The GitHub Repository URL
    repoURL: https://github.com/kserve/kserve.git
    # 2. Pin to a specific tag (matches your 0.17.0 script)
    targetRevision: v0.17.0 
    # 3. Path to the Resources chart (NOT the CRD chart)
    path: charts/kserve-resources
    helm:
      values: |
        kserve:
          # CRITICAL for M4: Disables Knative/Istio dependency
          deploymentMode: RawDeployment
          
          # Adjusting controller resources for a local lab
          controller:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
        
        # This tells KServe to use the Cert-Manager Issuer we just tested
        kserve_admission_webhook:
          certManager:
            enabled: true
            issuerRef:
              name: selfsigned-issuer
              kind: ClusterIssuer
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true