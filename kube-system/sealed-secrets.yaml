apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.15.x # Pin to a stable release version
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system # Standard convention for cluster-wide infrastructure operators
  syncPolicy:
    automated:
      prune: true
      selfHeal: true